name: Publish isolated MACE TorchSim benchmark image

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk for the large NGC base image
        shell: bash
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.torchsim
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jacpas1/lammps-mace-gpu:mace-torchsim-20260904
          build-args: |
            MACE_COMMIT=59ad3a473ca02101a1cf02db242197e8d616dd11
            IMAGE_REVISION=${{ github.sha }}
